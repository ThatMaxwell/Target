<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New tab</title>
<style>
  :root {
    --bg:#f4f4f2; --tile:#fff; --ink:#111; --on-ink:#fff; --muted:#6b6b68; --line:#e2e2de; --clock:#e3e3df;
    --font:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --out:cubic-bezier(.2,.8,.2,1); --expo:cubic-bezier(.16,1,.3,1);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0d0d0d; --tile:#171717; --ink:#f2f2f0; --on-ink:#111; --muted:#8d8d88; --line:#262626; --clock:#181818; color-scheme:dark; }
  }
  :root[data-theme="dark"] { --bg:#0d0d0d; --tile:#171717; --ink:#f2f2f0; --on-ink:#111; --muted:#8d8d88; --line:#262626; --clock:#181818; color-scheme:dark; }

  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--ink); font:14px/1.4 var(--font); -webkit-font-smoothing:antialiased; overflow:hidden; }
  button, input { font:inherit; color:inherit; }
  button { border:0; background:none; cursor:pointer; }
  :focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  svg.i { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; }

  /* top: the thick badge, nothing else */
  .top { position:fixed; top:18px; left:20px; z-index:2; }
  .badge { display:inline-grid; place-items:center; padding:5px 8px 6px; border-radius:7px; background:var(--ink); color:var(--on-ink); }
  .badge svg { display:block; height:15px; width:auto; fill:currentColor; }

  /* the time, huge, behind everything */
  .clock { position:fixed; inset:0; z-index:0; display:grid; place-items:center; pointer-events:none; }
  .clock svg { width:min(80vw, 132vh); height:auto; color:var(--clock); fill:currentColor; animation:fade .5s var(--out) both; }
  .clock use.in  { animation:roll-in .62s var(--expo) both; }
  .clock use.out { animation:roll-out .62s var(--expo) both; }

  /* shortcuts */
  .stage { position:relative; z-index:1; height:100%; display:grid; place-items:center; padding:24px; }
  /* sit on the lower third of the numerals, so the tops of the digits stay readable */
  .row { display:flex; flex-wrap:wrap; justify-content:center; gap:14px; max-width:min(92vw, 800px); transform:translateY(calc(min(80vw, 132vh) * .085)); }
  .sc { position:relative; width:76px; height:76px; animation:in .36s var(--expo) calc(80ms + var(--i) * 28ms) both; }
  .row.settled .sc { animation:none; }
  .sc a, .sc .add { position:relative; display:grid; place-items:center; width:100%; height:100%; border-radius:20px; background:var(--tile); border:1px solid var(--line);
                    transition:transform .15s var(--out), border-color .15s var(--out); }
  .sc a:hover, .sc .add:hover { transform:translateY(-3px); border-color:var(--muted); }
  .sc a:active, .sc .add:active { transform:scale(.96); }
  .sc img, .sc .gl { width:36px; height:36px; border-radius:9px; object-fit:contain; }
  .sc .gl { padding:6px; color:var(--muted); fill:none; stroke:currentColor; stroke-width:1.8; }
  .sc .add { background:transparent; color:var(--muted); }
  .sc .add svg.i { width:18px; height:18px; }
  .row:not(:hover):not(:focus-within) .sc.plus { opacity:0; }
  .sc.plus { transition:opacity .2s var(--out); }
  .lbl { position:absolute; top:calc(100% + 10px); left:50%; transform:translate(-50%, -4px); opacity:0; pointer-events:none; white-space:nowrap;
         font-size:12.5px; font-weight:600; color:var(--muted); transition:opacity .15s var(--out), transform .15s var(--out); }
  .sc:hover .lbl, .sc:focus-within .lbl { opacity:1; transform:translate(-50%, 0); }
  .rm { position:absolute; top:-7px; right:-7px; z-index:1; width:22px; height:22px; border-radius:11px; display:grid; place-items:center; background:var(--ink); color:var(--on-ink);
        opacity:0; transform:scale(.8); transition:opacity .15s var(--out), transform .15s var(--out); }
  .rm svg.i { width:10px; height:10px; stroke-width:3; }
  .sc:hover .rm, .sc:focus-within .rm { opacity:1; transform:none; }
  .row.settled .sc.bye { animation:bye .18s cubic-bezier(.5,0,.75,0) forwards; }

  /* lock-on: focus brackets snap onto the shortcut you're about to open */
  .sc a::after, .sc .add::after { content:""; position:absolute; inset:-7px; pointer-events:none; opacity:0; transform:scale(1.1); --c:var(--ink); --l:13px; --w:2.5px;
    background:
      linear-gradient(var(--c),var(--c)) top left / var(--l) var(--w), linear-gradient(var(--c),var(--c)) top left / var(--w) var(--l),
      linear-gradient(var(--c),var(--c)) top right / var(--l) var(--w), linear-gradient(var(--c),var(--c)) top right / var(--w) var(--l),
      linear-gradient(var(--c),var(--c)) bottom left / var(--l) var(--w), linear-gradient(var(--c),var(--c)) bottom left / var(--w) var(--l),
      linear-gradient(var(--c),var(--c)) bottom right / var(--l) var(--w), linear-gradient(var(--c),var(--c)) bottom right / var(--w) var(--l);
    background-repeat:no-repeat; transition:opacity .15s var(--out), transform .15s var(--out); }
  .sc a:hover::after, .sc a:focus-visible::after, .sc .add:hover::after, .sc .add:focus-visible::after { opacity:1; transform:none; }
  .sc a:focus-visible, .sc .add:focus-visible { outline:none; }

  /* add a shortcut */
  dialog { width:min(360px, calc(100vw - 32px)); padding:14px; border-radius:20px; border:1px solid var(--line); background:var(--tile); color:var(--ink); }
  dialog[open] { animation:in .22s var(--expo); }
  dialog::backdrop { background:rgba(0,0,0,.2); }
  dialog form { display:flex; gap:8px; }
  dialog input { flex:1; min-width:0; height:42px; padding:0 12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); outline:none; transition:border-color .15s var(--out); }
  dialog input:focus { border-color:var(--ink); }
  dialog button { height:42px; padding:0 16px; border-radius:12px; background:var(--ink); color:var(--on-ink); font-weight:650; transition:transform .11s var(--out); }
  dialog button:active { transform:scale(.96); }

  @keyframes fade { from { opacity:0; } }
  @keyframes in { from { opacity:0; transform:translateY(8px); } }
  @keyframes bye { to { opacity:0; transform:scale(.85); } }
  @keyframes roll-in { from { transform:translateY(108px); } }
  @keyframes roll-out { from { transform:none; } to { transform:translateY(-108px); } }

  @media (max-width:560px) {
    .row { gap:12px; max-width:304px; }
    .sc { width:64px; height:64px; }
    .sc img, .sc .gl { width:30px; height:30px; }
    .clock svg { width:92vw; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header class="top"><span class="badge"><svg viewBox="-2 2 416 130" role="img" aria-label="target"><g transform="translate(0 0) scale(1)"><g transform="translate(0 0)"><path fill="currentColor" d="M8 4 H32 V26 H50 V46 H32 V68 Q32 76 40 76 H52 V100 H38 Q8 100 8 70 V46 H0 V26 H8 Z"/></g><g transform="translate(58 0)"><path fill="currentColor" fill-rule="evenodd" d="M30 26 H40 A30 30 0 0 1 70 56 V70 A30 30 0 0 1 40 100 H30 A30 30 0 0 1 0 70 V56 A30 30 0 0 1 30 26 Z M34 48 H36 A10 10 0 0 1 46 58 V68 A10 10 0 0 1 36 78 H34 A10 10 0 0 1 24 68 V58 A10 10 0 0 1 34 48 Z"/><rect fill="currentColor" x="50" y="26" width="24" height="74"/></g><g transform="translate(138 0)"><path fill="currentColor" d="M0 26 H24 V36 Q30 26 46 26 H58 V50 H46 Q24 50 24 70 V100 H0 Z"/></g><g transform="translate(202 0)"><path fill="currentColor" fill-rule="evenodd" d="M30 26 H40 A30 30 0 0 1 70 56 V66 A30 30 0 0 1 40 96 H30 A30 30 0 0 1 0 66 V56 A30 30 0 0 1 30 26 Z M34 46 H36 A10 10 0 0 1 46 56 V64 A10 10 0 0 1 36 74 H34 A10 10 0 0 1 24 64 V56 A10 10 0 0 1 34 46 Z"/><path fill="currentColor" d="M50 26 H74 V104 Q74 130 46 130 H6 V110 H44 Q50 110 50 104 Z"/></g><g transform="translate(282 0)"><mask id="e2" maskUnits="userSpaceOnUse" x="-4" y="20" width="84" height="86"><path fill="white" d="M30 26 H42 A30 30 0 0 1 72 56 V70 A30 30 0 0 1 42 100 H30 A30 30 0 0 1 0 70 V56 A30 30 0 0 1 30 26 Z"/><path fill="black" d="M28 44 H44 A6 6 0 0 1 50 50 V50 A6 6 0 0 1 44 56 H28 A6 6 0 0 1 22 50 V50 A6 6 0 0 1 28 44 Z"/><rect fill="black" x="22" y="72" width="60" height="10"/></mask><rect mask="url(#e2)" fill="currentColor" x="-4" y="20" width="84" height="86"/></g><g transform="translate(360 0)"><path fill="currentColor" d="M8 4 H32 V26 H50 V46 H32 V68 Q32 76 40 76 H52 V100 H38 Q8 100 8 70 V46 H0 V26 H8 Z"/></g></g></svg></span></header>

<div class="clock" aria-hidden="true">
  <svg id="clock" viewBox="-4 -2 326 108">
    <defs><g id="g0"><path fill="currentColor" fill-rule="evenodd" d="M32 4 H34 A32 32 0 0 1 66 36 V68 A32 32 0 0 1 34 100 H32 A32 32 0 0 1 0 68 V36 A32 32 0 0 1 32 4 Z M33 28 H33 A9 9 0 0 1 42 37 V67 A9 9 0 0 1 33 76 H33 A9 9 0 0 1 24 67 V37 A9 9 0 0 1 33 28 Z"/></g><g id="g1"><path fill="currentColor" d="M18 4 H55 V100 H31 V28 H18 Z"/></g><g id="g2"><path fill="currentColor" d="M0 36 Q0 4 33 4 Q66 4 66 36 Q66 54 50 66 L37 76 H66 V100 H0 V78 L32 54 Q42 46 42 37 Q42 28 33 28 Q24 28 24 37 V40 H0 Z"/></g><g id="g3"><path fill="currentColor" d="M0 4 H64 V25 L45 44 Q66 50 66 71 Q66 100 33 100 Q0 100 0 74 H24 Q25 78 33 78 Q42 78 42 70 Q42 61 31 61 H22 V43 L36 26 H0 Z"/></g><g id="g4"><path fill="currentColor" fill-rule="evenodd" d="M36 4 H62 V58 H68 V80 H62 V100 H38 V80 H-2 V58 Z M38 58 V43 L27 58 Z"/></g><g id="g5"><path fill="currentColor" d="M3 4 H63 V26 H27 V40 Q31 38 37 38 Q66 38 66 69 Q66 100 33 100 Q0 100 0 74 H24 Q25 78 33 78 Q42 78 42 69 Q42 60 33 60 Q27 60 25 64 H3 Z"/></g><g id="g6"><path fill="currentColor" fill-rule="evenodd" d="M30 38 H36 A30 30 0 0 1 66 68 V70 A30 30 0 0 1 36 100 H30 A30 30 0 0 1 0 70 V68 A30 30 0 0 1 30 38 Z M33 60 H33 A9 9 0 0 1 42 69 V69 A9 9 0 0 1 33 78 H33 A9 9 0 0 1 24 69 V69 A9 9 0 0 1 33 60 Z"/><path fill="currentColor" d="M0 70 V40 Q0 4 36 4 H58 V28 H37 Q24 28 24 41 V70 Z"/></g><g id="g7"><path fill="currentColor" d="M0 4 H66 V26 L35 100 H9 L41 26 H0 Z"/></g><g id="g8"><path fill="currentColor" fill-rule="evenodd" d="M29 4 H37 A24 24 0 0 1 61 28 V28 A24 24 0 0 1 37 52 H29 A24 24 0 0 1 5 28 V28 A24 24 0 0 1 29 4 Z M32 24 H34 A5 5 0 0 1 39 29 V29 A5 5 0 0 1 34 34 H32 A5 5 0 0 1 27 29 V29 A5 5 0 0 1 32 24 Z"/><path fill="currentColor" fill-rule="evenodd" d="M28 44 H38 A28 28 0 0 1 66 72 V72 A28 28 0 0 1 38 100 H28 A28 28 0 0 1 0 72 V72 A28 28 0 0 1 28 44 Z M32 64 H34 A8 8 0 0 1 42 72 V72 A8 8 0 0 1 34 80 H32 A8 8 0 0 1 24 72 V72 A8 8 0 0 1 32 64 Z"/></g><g id="g9"><g transform="rotate(180 33 52)"><path fill="currentColor" fill-rule="evenodd" d="M30 38 H36 A30 30 0 0 1 66 68 V70 A30 30 0 0 1 36 100 H30 A30 30 0 0 1 0 70 V68 A30 30 0 0 1 30 38 Z M33 60 H33 A9 9 0 0 1 42 69 V69 A9 9 0 0 1 33 78 H33 A9 9 0 0 1 24 69 V69 A9 9 0 0 1 33 60 Z"/><path fill="currentColor" d="M0 70 V40 Q0 4 36 4 H58 V28 H37 Q24 28 24 41 V70 Z"/></g></g><g id="gc"><path fill="currentColor" d="M6 30 H16 A6 6 0 0 1 22 36 V46 A6 6 0 0 1 16 52 H6 A6 6 0 0 1 0 46 V36 A6 6 0 0 1 6 30 Z M6 72 H16 A6 6 0 0 1 22 78 V88 A6 6 0 0 1 16 94 H6 A6 6 0 0 1 0 88 V78 A6 6 0 0 1 6 72 Z"/></g><clipPath id="slot"><rect x="-8" y="-2" width="82" height="108"/></clipPath></defs>
    <g transform="translate(0 0)" clip-path="url(#slot)" class="slot"><use/><use/></g>
    <g transform="translate(74 0)" clip-path="url(#slot)" class="slot"><use/><use/></g>
    <use href="#gc" transform="translate(148 0)"/>
    <g transform="translate(178 0)" clip-path="url(#slot)" class="slot"><use/><use/></g>
    <g transform="translate(252 0)" clip-path="url(#slot)" class="slot"><use/><use/></g>
  </svg>
</div>
<p class="sr" id="time"></p>

<main class="stage"><nav class="row" id="row" aria-label="Shortcuts"></nav></main>

<dialog id="dlg" aria-label="Add a shortcut">
  <form method="dialog" id="form">
    <input id="site" placeholder="Add a site, like github.com" aria-label="Site address" autocomplete="off" spellcheck="false" required>
    <button value="ok">Add</button>
  </form>
</dialog>

<script>
  // ---------- shortcuts ----------
  // In the app, icons come from the browser's own favicon cache. This page falls back to
  // the site's own icon, then DuckDuckGo's icon service, then a neutral globe. Never a letter.
  const KEY = "tgt-shortcuts";
  const G = "https://www.gstatic.com/images/branding/product/2x/";
  const DEFAULTS = [
    { n: "YouTube", u: "https://www.youtube.com", i: G + "youtube_48dp.png" },
    { n: "Gmail", u: "https://mail.google.com", i: G + "gmail_2020q4_48dp.png" },
    { n: "GitHub", u: "https://github.com" },
    { n: "Wikipedia", u: "https://www.wikipedia.org" },
    { n: "Reddit", u: "https://www.reddit.com" },
    { n: "Maps", u: "https://maps.google.com" },
    { n: "Docs", u: "https://docs.google.com", i: G + "docs_2020q4_48dp.png" },
    { n: "Spotify", u: "https://open.spotify.com" },
  ];
  const X = '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const PLUS = '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
  const GLOBE = '<svg class="gl" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>';

  let list;
  try { list = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!Array.isArray(list)) list = DEFAULTS.slice();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} };
  const host = u => { try { return new URL(u).hostname; } catch (e) { return ""; } };
  const row = document.getElementById("row");

  function icon(img, s) {
    const h = host(s.u);
    const srcs = [s.i, h && `https://${h}/apple-touch-icon.png`, h && `https://icons.duckduckgo.com/ip3/${h}.ico`].filter(Boolean);
    let k = 0;
    const next = () => { if (k < srcs.length) img.src = srcs[k++]; else img.outerHTML = GLOBE; };
    img.onerror = next; next();
  }

  function render() {
    row.innerHTML = "";
    list.forEach((s, i) => {
      const el = document.createElement("div");
      el.className = "sc"; el.style.setProperty("--i", i);
      el.innerHTML = `<a><img alt="" decoding="async"></a><span class="lbl"></span><button class="rm" type="button">${X}</button>`;
      const a = el.querySelector("a"); a.href = s.u; a.setAttribute("aria-label", s.n);
      el.querySelector(".lbl").textContent = s.n;
      icon(el.querySelector("img"), s);
      const rm = el.querySelector(".rm"); rm.setAttribute("aria-label", "Remove " + s.n);
      rm.addEventListener("click", () => {
        row.classList.add("settled"); el.classList.add("bye");
        setTimeout(() => { list.splice(list.indexOf(s), 1); save(); render(); }, 170);
      });
      row.appendChild(el);
    });
    if (list.length < 10) {
      const el = document.createElement("div");
      el.className = "sc plus"; el.style.setProperty("--i", list.length);
      el.innerHTML = `<button class="add" type="button" aria-label="Add a shortcut">${PLUS}</button>`;
      el.querySelector("button").addEventListener("click", () => { document.getElementById("form").reset(); document.getElementById("dlg").showModal(); });
      row.appendChild(el);
    }
  }
  document.getElementById("form").addEventListener("submit", e => {
    if (!e.submitter || e.submitter.value !== "ok") return;
    let u = document.getElementById("site").value.trim();
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    const h = host(u);
    if (!h || !h.includes(".")) { e.preventDefault(); return; }
    const base = h.replace(/^www\./, "").split(".")[0];
    list.push({ n: base.charAt(0).toUpperCase() + base.slice(1), u });
    save(); row.classList.add("settled"); render();
  });
  render();
  setTimeout(() => row.classList.add("settled"), 900);

  // ---------- the clock: drawn digits that roll when they change ----------
  const svg = document.getElementById("clock");
  const slots = [...svg.querySelectorAll(".slot")];
  const h12 = new Intl.DateTimeFormat(undefined, { hour: "numeric" }).resolvedOptions().hour12;
  const shown = ["", "", "", ""];
  const restart = (el, cls) => { el.classList.remove("in", "out"); void el.getBoundingClientRect(); el.classList.add(cls); };

  function draw(animate) {
    const d = new Date();
    let h = d.getHours();
    if (h12) h = h % 12 || 12;
    const s = (h12 ? String(h).padStart(2, " ") : String(h).padStart(2, "0")) + String(d.getMinutes()).padStart(2, "0");
    [...s].forEach((c, k) => {
      if (c === shown[k]) return;
      const [now, prev] = slots[k].children;
      if (animate && shown[k] && shown[k] !== " ") { prev.setAttribute("href", "#g" + shown[k]); restart(prev, "out"); }
      if (c === " ") now.removeAttribute("href"); else now.setAttribute("href", "#g" + c);
      if (animate) restart(now, "in");
      shown[k] = c;
    });
    slots[0].style.display = s[0] === " " ? "none" : "";
    svg.setAttribute("viewBox", s[0] === " " ? "70 -2 252 108" : "-4 -2 326 108");
    document.getElementById("time").textContent = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }
  draw(false);
  setTimeout(function tick() { draw(true); setTimeout(tick, 60000 - (Date.now() % 60000) + 30); }, 60000 - (Date.now() % 60000) + 30);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) draw(false); });
</script>
</body>
</html>
