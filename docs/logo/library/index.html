<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab logo library</title>
<style>
  :root { --bg:#f4f4f2; --tile:#fff; --ink:#111; --muted:#6b6b68; --line:#e2e2de; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; padding:48px 16px 96px; }
  main { max-width:1120px; margin:0 auto; }
  h1 { font-size:44px; font-weight:850; letter-spacing:-0.035em; line-height:.95; }
  h2 { font-size:22px; font-weight:750; letter-spacing:-0.02em; margin:56px 0 16px; display:flex; gap:10px; align-items:baseline; }
  h2 small { font-size:13px; font-weight:500; color:var(--muted); letter-spacing:0; }
  p.lead { color:var(--muted); margin:12px 0 8px; max-width:62ch; }
  nav { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
  nav a { font-size:13px; color:var(--ink); text-decoration:none; padding:6px 12px; border-radius:999px; background:#e7e7e3; }
  nav a:hover { background:#dcdcd7; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .card { background:var(--tile); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .card.wide { grid-column:span 2; }
  @media (max-width:560px){ .card.wide { grid-column:auto; } }
  .pair { display:grid; grid-template-columns:1fr 1fr; }
  .pair div { min-height:150px; display:grid; place-items:center; padding:20px; }
  .pair .dark { background:#0e0e0e; }
  .pair .dark img.inv { filter:invert(1); }
  .pair img { max-width:100%; max-height:110px; }
  .card:not(.wide) .pair img { width:70%; }
  .sizes { display:flex; align-items:end; gap:12px; padding:0 14px 12px; min-height:44px; }
  .meta { padding:12px 14px 14px; border-top:1px solid var(--line); }
  .meta b { font-weight:650; } .meta i { font-style:normal; color:var(--muted); font-size:12px; margin-left:6px; }
  .meta span { display:block; color:var(--muted); font-size:13px; }
</style></head>
<body><main>
  <h1>Tab<br>logo library</h1>
  <p class="lead">42 concepts, all drawn from one t, one bowl and one stem. Light and dark side by side; small sizes under the square marks. Concepts, not finals.</p>

const FAMS = [["Thick badges", [["01-badge-white.svg", "White badge", "Extra-heavy wordmark in a white block. Drops into any dark control as a label.", true, true], ["02-badge-black.svg", "Black badge", "The same block in black, for light UI.", true, false], ["03-badge-ultra.svg", "Ultra badge", "Fattened until the counters almost close. Maximum weight, tightest padding.", true, false], ["04-badge-accent.svg", "Accent badge", "The badge in the one brand color.", true, true], ["05-badge-t.svg", "t block", "The square version: heavy t in a block, for spots too small for the word.", false, false], ["06-badge-in-use.svg", "In use", "The badge as a label inside a dark dropdown, the way mini uses its mark.", true, true]]], ["Wordmarks", [["07-wordmark.svg", "tab", "The base wordmark. Heavy, tight, geometric.", true, false], ["08-wordmark-period.svg", "tab.", "A full stop: decided, done. The dot is square to match the stems.", true, false], ["09-wordmark-crossbar.svg", "Crossbar strip", "The t's crossbar runs the full width, like a tab strip at x-height.", true, false], ["10-wordmark-key.svg", "tab \u21e5", "The wordmark followed by the Tab key symbol, same stroke weight.", true, false], ["11-wordmark-cursor.svg", "tab|", "Being typed: a text cursor after the b.", true, false], ["12-wordmark-outline.svg", "Outline", "The wordmark as a line. For huge sizes and backgrounds only.", true, false], ["13-wordmark-strip.svg", "On the strip", "Wordmark sitting on a heavy strip line that runs past both ends.", true, false], ["14-wordmark-pill.svg", "In a capsule", "Wordmark inside a black capsule, like a selected tab title.", true, false], ["15-wordmark-dots.svg", "Solid bowls", "Bowls filled in: louder, more graphic, less readable.", true, false]]], ["Monograms", [["16-t-circle.svg", "t in a circle", "The simplest badge. The t sits slightly left of center.", false, false], ["17-t-square.svg", "t in a square", "Hard square, no rounding. Most severe.", false, false], ["18-t-capsule.svg", "t in a wide capsule", "Wide capsule, t at the right end. Reads as a tab title, not a switch.", false, false], ["19-t-arrow.svg", "t \u21e5", "The crossbar becomes an arrow: the letter t and the Tab key at once.", false, false], ["20-t-stencil.svg", "Stencil t", "A cut through the stem, like a stencil. Industrial.", false, false], ["21-t-italic.svg", "Leaning t", "Slanted forward: speed, motion.", false, false], ["22-t-round.svg", "Rounded t", "Same skeleton, round ends. Friendlier.", false, false], ["23-t-outline.svg", "Outline t", "The t as a line. Light, for UI chrome.", false, false]]], ["Tab key", [["24-key-arrow.svg", "\u21e5", "The Tab key symbol alone. Owns the name's second meaning.", false, false], ["25-key-circle.svg", "\u21e5 in a circle", "The symbol on a round badge.", false, false], ["26-key-tag.svg", "Tag", "An arrow-shaped tag (a pull-tab, a label) with the t in it.", false, false], ["27-key-arrow-t.svg", "\u2192 t", "An arrow that hits a t instead of a wall.", false, false]]], ["Tab shapes", [["28-shape-strip3.svg", "Three tabs", "A strip of three; ours is the black one.", true, false], ["29-shape-outline.svg", "Outline tab", "The wide tab drawn as one line, strip included.", true, false], ["30-shape-notch.svg", "Negative tab", "A slab with a tab-shaped bite out of its top. The tab is the gap.", true, false], ["31-shape-minimal.svg", "t + \u00d7", "A wide tab with just the t and the close mark. A tab with nothing in it but us.", true, false]]], ["Keyboard", [["32-keycap.svg", "Keycap", "The Tab key itself: label bottom-left, \u21e5 top-right.", false, false], ["33-keycap-line.svg", "Keycap, line", "The key drawn as an outline.", false, false], ["34-key-square.svg", "\u21e5 key", "A square key with only the symbol.", false, false]]], ["Abstract", [["35-abs-bars.svg", "Tab list", "Three bars: a list of open tabs, the current one on top.", false, false], ["36-abs-stack.svg", "Stack", "Three tabs stacked; ours in front.", false, false], ["37-abs-bowl.svg", "The bowl", "The a from the wordmark on its own: a ring and a stem.", false, false], ["38-abs-corner.svg", "The corner", "Just the rounded top corner of a tab. The least you need to say 'tab'.", false, false], ["39-abs-grid.svg", "Tab overview", "A 2\u00d72 grid of tabs, one active.", false, false]]], ["Lockups", [["40-lockup-key.svg", "\u21e5 + tab", "Icon and wordmark side by side.", true, false], ["41-lockup-t-arrow.svg", "t\u21e5 + tab", "The arrow-t monogram leading the wordmark.", true, false], ["42-lockup-accent.svg", "Accent lockup", "The one place the yellow lives: behind the wordmark.", true, true]]]];
const card = ([f, n, d, wide, keep]) => `
  <section class="card${wide ? " wide" : ""}">
    <div class="pair"><div><img src="${SVG[f]}" alt="${n}"></div><div class="dark"><img class="${keep ? "" : "inv"}" src="${SVG[f]}" alt=""></div></div>
    ${wide ? "" : `<div class="sizes"><img src="${SVG[f]}" width="48" alt=""><img src="${SVG[f]}" width="32" alt=""><img src="${SVG[f]}" width="16" alt=""></div>`}
    <div class="meta"><b>${n}</b><i>${f.slice(0, 2)}</i><span>${d}</span></div>
  </section>`;
const id = s => s.toLowerCase().replace(/[^a-z]+/g, "-");
document.getElementById("nav").innerHTML = FAMS.map(([fam, its]) => `<a href="#${id(fam)}">${fam} · ${its.length}</a>`).join("");
document.getElementById("out").innerHTML = FAMS.map(([fam, its]) =>
  `<h2 id="${id(fam)}">${fam}<small>${its.length}</small></h2><div class="grid">${its.map(card).join("")}</div>`).join("");
</script></body></html>
