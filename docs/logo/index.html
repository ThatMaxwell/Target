<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab logo concepts</title>
<style>
  :root { --bg:#f4f4f2; --tile:#fff; --ink:#111; --muted:#6b6b68; --line:#e2e2de; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; padding:48px 16px; }
  main { max-width:1040px; margin:0 auto; }
  h1 { font-size:34px; font-weight:800; letter-spacing:-0.03em; line-height:1; }
  h2 { font-size:22px; font-weight:750; letter-spacing:-0.02em; margin-top:56px; }
  p.lead { color:var(--muted); margin:10px 0 24px; max-width:60ch; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .card { background:var(--tile); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .card.wide { grid-column:1/-1; }
  .pair { display:grid; grid-template-columns:1fr 1fr; }
  .pair div { aspect-ratio:1; display:grid; place-items:center; }
  .wide .pair div { aspect-ratio:auto; padding:40px 24px; }
  .pair .dark { background:#0e0e0e; }
  .pair .dark img.inv { filter:invert(1); }
  .pair img { width:62%; max-width:100%; }
  .wide .pair img { width:90%; }
  .sizes { display:flex; align-items:end; gap:14px; padding:0 16px 16px; }
  .meta { padding:14px 16px 16px; border-top:1px solid var(--line); }
  .meta b { font-weight:650; } .meta span { display:block; color:var(--muted); font-size:13.5px; }
  @media (max-width:640px){ .wide .pair { grid-template-columns:1fr; } }
</style></head>
<body><main>
  <h1>Tab: logo concepts</h1>
  <p class="lead">Concepts, not finals. Each shown on light and dark, plus 64, 32 and 16 px for the marks.</p>
  <div id="out"></div>
</main>

const SECTIONS = [["Round 3: icons", "App-icon ideas beyond the tab shape. Tab is also a key on every keyboard, so 18 and 19 use that.", [["18-icon-tab-key.svg", "Tab key", "The Tab key symbol: an arrow that hits a wall. The name's second meaning.", 0, 0], ["19-icon-keycap.svg", "Keycap", "The actual Tab keycap: label bottom-left, arrow top-right. On the yellow accent.", 0, 1], ["14-icon-wordmark.svg", "Wordmark tile", "The wordmark oversized and cropped by the tile.", 0, 0], ["15-icon-big-t.svg", "Big t", "One giant t, tail always visible. With the tail cropped it read as a cross.", 0, 0], ["16-icon-wide-tab.svg", "Wide tab tile", "The wide tab (08) shrunk onto a tile, on its strip.", 0, 0], ["17-icon-stack.svg", "Stack", "A stack of tabs: many open, one in front.", 0, 0], ["20-icon-address.svg", "Address bar", "An address bar with a t and a blinking caret.", 0, 0]]], ["Round 2: out of the tombstone", "Round 1 read as a gravestone: a tall slab with a rounded top and one carved letter. Round 2 keeps tabs wide, on a strip, or part of a window.", [["08-wide-tab.svg", "Wide tab", "Real browser proportions: wide, on the strip, title and close button.", 1, 0], ["09-strip.svg", "Tab strip", "Two tabs on a strip; the active one is ours. Low and wide.", 0, 0], ["10-window.svg", "Window", "A window body with one tab at the top left. Verdict: it reads as a folder icon. Dead end.", 0, 0], ["12-icon-color.svg", "Icon with accent", "The window mark on one accent color. Tests the 'brand color in one place' rule.", 0, 1], ["13-startup-window.svg", "Startup: window", "Body rises, the tab pops out of its top edge, the t lifts in. Loops here.", 0, 0], ["11-hero-window.svg", "As material: window", "A giant window rising from the screen bottom, wordmark cropped by the edge.", 1, 0]]], ["Round 1", "Kept for comparison. The wordmark and the hero crop still hold up; the tall tab marks are the tombstones.", [["05-wordmark.svg", "Wordmark", "Heavy and tight. Round bowls, single-story a, same stroke as the t.", 1, 0], ["01-tab.svg", "Tab", "Tall tab with a heavy t pushed left.", 0, 0], ["02-tab-flared.svg", "Flared tab", "Real tab silhouette with the t cut out.", 0, 0], ["03-t.svg", "The t", "The letter alone, drawn by hand.", 0, 0], ["04-app-icon.svg", "App icon", "A white tab rising from the bottom of a black tile.", 0, 0], ["07-startup.svg", "Startup: strip", "Strip draws out, tab rises, t lifts in.", 0, 0], ["06-hero.svg", "As material", "Giant tab from the screen edge, wordmark cropped.", 1, 0]]]];
const card = ([f, n, d, wide, keep]) => `
  <section class="card${wide ? " wide" : ""}">
    <div class="pair"><div><img src="${SVG[f]}" alt="${n}"></div><div class="dark"><img class="${keep ? "" : "inv"}" src="${SVG[f]}" alt=""></div></div>
    ${wide ? "" : `<div class="sizes"><img src="${SVG[f]}" width="64" alt=""><img src="${SVG[f]}" width="32" alt=""><img src="${SVG[f]}" width="16" alt=""></div>`}
    <div class="meta"><b>${n}</b><span>${d}</span></div>
  </section>`;
document.getElementById("out").innerHTML = SECTIONS.map(([title, lead, items]) =>
  `<h2>${title}</h2><p class="lead">${lead}</p><div class="grid">${items.map(card).join("")}</div>`).join("");
</script></body></html>
