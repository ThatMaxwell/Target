<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Target Plus</title>
<!-- Sky photo: "Sky Clouds and Atmosphere", Wikimedia Commons, CC0 (public domain).
     https://commons.wikimedia.org/wiki/File:Sky_Clouds_and_Atmosphere.jpg -->
<style>
  :root {
    /* this card takes its colors from the sky photo (slate blue #647183, sampled), not the browser's black and white */
    --page:#e3e8ef; --paper:#f3f6fa; --ink:#1b2a3e; --on-ink:#f3f6fa; --muted:#5d6c80; --line:#d2dae5;
    --font:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --out:cubic-bezier(.2,.8,.2,1); --expo:cubic-bezier(.16,1,.3,1);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page:#090e15; --paper:#101924; --ink:#e9f0f8; --on-ink:#101924; --muted:#92a1b5; --line:#213044; color-scheme:dark; }
  }
  :root[data-theme="dark"] { --page:#090e15; --paper:#101924; --ink:#e9f0f8; --on-ink:#101924; --muted:#92a1b5; --line:#213044; color-scheme:dark; }

  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { min-height:100%; }
  body { display:grid; place-items:center; min-height:100vh; padding:24px 16px; background:var(--page); color:var(--ink);
         font:14px/1.4 var(--font); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  h1 { text-wrap:balance; } p { text-wrap:pretty; }
  svg.i { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }

  .card { position:relative; width:min(380px, 100%); border-radius:20px; overflow:hidden; background:var(--paper); border:1px solid var(--line);
          animation:rise .7s var(--expo) both; }

  /* the sky: a real photo that drifts very slowly, then dissolves into the paper */
  .sky { position:relative; height:300px; overflow:hidden; }
  .sky img { position:absolute; inset:-6%; width:112%; height:112%; object-fit:cover; object-position:60% 40%;
             animation:drift 28s ease-in-out infinite alternate; }
  .sky::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, var(--paper) 100%); }

  .head { position:relative; z-index:1; margin-top:-92px; padding:0 26px; }
  .name svg { display:block; height:56px; width:auto; }
  .name .plus { fill:#111; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .name .plus { fill:var(--ink); } }
  :root[data-theme="dark"] .name .plus { fill:var(--ink); }
  .price { display:flex; align-items:baseline; gap:6px; margin-top:12px; }
  .price b { font-size:22px; font-weight:800; letter-spacing:-.02em; }
  .price span { font-size:13.5px; font-weight:550; color:var(--muted); }

  .body { padding:22px 26px 26px; }
  ul { list-style:none; display:grid; gap:12px; }
  li { display:flex; gap:12px; align-items:flex-start; font-size:14.5px; font-weight:550; line-height:1.35; }
  li svg.i { margin-top:1px; }
  li span { color:var(--muted); font-weight:500; display:block; font-size:13px; margin-top:2px; }

  .go { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:48px; margin-top:24px; border:0; border-radius:12px;
        background:var(--ink); color:var(--on-ink); font:650 15px var(--font); cursor:pointer;
        transition:transform .11s var(--out), opacity .15s var(--out); }
  .go:hover { opacity:.88; }
  .go:active { transform:scale(.97); }
  .go:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
  .go svg.i { transition:transform .15s var(--out); }
  .go:hover svg.i { transform:translateX(2px); }
  .note { margin-top:12px; font-size:12.5px; color:var(--muted); text-align:center; }

  @keyframes rise { from { opacity:0; transform:translateY(12px); } }
  @keyframes drift { from { transform:scale(1) translate(0, 0); } to { transform:scale(1.06) translate(-1.5%, 1%); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<article class="card" aria-labelledby="plan">
  <div class="sky">
    <img src="sky.jpg" alt="">
  </div>
  <div class="head">
    <h1 id="plan" aria-label="Target Plus"><span class="name">__BADGE__</span></h1>
    <p class="price"><b>$4</b><span>a month, after a 14-day trial</span></p>
  </div>
  <div class="body">
    <ul>
      <li><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <div>Sync everywhere<span>Tabs, shortcuts and history on every device.</span></div></li>
      <li><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <div>AI, only when you ask<span>An assistant that stays off until you turn it on.</span></div></li>
      <li><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <div>Automation<span>Let your tools drive the browser through MCP.</span></div></li>
    </ul>
    <button class="go" type="button">Start free trial
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <p class="note">The browser stays free. Cancel anytime.</p>
  </div>
</article>
</body>
</html>
