<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cubit logo concepts</title>
<style>
  :root { --bg: #f4f4f2; --tile: #fff; --ink: #111; --muted: #6b6b68; --line: #e2e2de; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif; padding: 48px 16px; }
  main { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
  p.lead { color: var(--muted); margin: 6px 0 36px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card { background: var(--tile); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; }
  .pair div { aspect-ratio: 1; display: grid; place-items: center; }
  .pair .dark { background: #0e0e0e; }
  .pair .dark img { filter: invert(1); }
  .pair img { width: 62%; }
  .meta { padding: 14px 16px 16px; border-top: 1px solid var(--line); }
  .meta b { font-weight: 600; }
  .meta span { display: block; color: var(--muted); font-size: 13.5px; }
  .sizes { display: flex; align-items: end; gap: 14px; padding: 0 16px 16px; }
  .sizes img { display: block; }
</style>
</head>
<body>
<main>
  <h1>Cubit: logo concepts</h1>
  <p class="lead">Concepts, not finals. Each one is shown on light and on dark, with small sizes at the bottom (64, 32, 16 px).</p>
  <div class="grid" id="grid"></div>
</main>

<script>
  const items = [
    ["01-solid.svg", "Solid cube", "Three shaded faces. The plain answer: it's a cube."],
    ["02-flat.svg", "Flat cube", "One ink, cut by three thin lines. Survives 16 px and printing in one color."],

    ["04-cubit.svg", "Cubit", "Cube + bit: one small cube taken out of the corner. The name is in the shape."],
    ["05-cube-and-bit.svg", "Cube and bit", "The bit sits beside the cube instead of missing from it."],
    ["06-front.svg", "Front-on", "The cube seen straight from the front: a black square."],
    ["07-startup.svg", "Startup animation", "Faces slide in, the cube holds, then the bit lifts out of the corner. Loops here for preview."],
  ];
  document.getElementById("grid").innerHTML = items.map(([f, n, d]) => `
    <section class="card">
      <div class="pair"><div><img src="${SVG[f]}" alt="${n}"></div><div class="dark"><img src="${SVG[f]}" alt=""></div></div>
      <div class="sizes"><img src="${SVG[f]}" width="64" alt=""><img src="${SVG[f]}" width="32" alt=""><img src="${SVG[f]}" width="16" alt=""></div>
      <div class="meta"><b>${n}</b><span>${d}</span></div>
    </section>`).join("");
</script>

</html>
