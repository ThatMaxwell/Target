<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Startup animation concept (loops for preview):
       1. the tab strip line draws out from the center
       2. the tab rises out of it
       3. the t lifts into place. -->
  <style>
    .a { animation-duration: 3.4s; animation-iteration-count: infinite; animation-fill-mode: both; }
    .strip { animation-name: strip; transform-origin: 50px 84px; }
    .tab   { animation-name: tab;   transform-origin: 50px 84px; }
    .t     { animation-name: t; }
    @keyframes strip { 0% { transform: scaleX(0); animation-timing-function: cubic-bezier(.2,.8,.2,1); } 10% { transform: none; } 90% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes tab   { 0%, 8% { transform: scaleY(0); animation-timing-function: cubic-bezier(.3,1.25,.5,1); } 24% { transform: none; } 90% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes t     { 0%, 20% { transform: translateY(12px); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); } 32% { transform: none; opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .a { animation: none; } }
  </style>
  <rect class="a strip" x="0" y="83.25" width="100" height="1.5" fill="#111"/>
  <path class="a tab" d="M8 84 V40 A18 18 0 0 1 26 22 H74 A18 18 0 0 1 92 40 V84 Z" fill="#111"/>
  <g class="a t"><path transform="translate(22 30) scale(.5)" d="M10 6 H30 V26 H46 V44 H30 V72 Q30 82 42 82 H50 V100 H40 Q10 100 10 72 V44 H0 V26 H10 Z" fill="#fff"/></g>
</svg>
